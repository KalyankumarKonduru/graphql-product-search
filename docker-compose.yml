version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gql-backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - APP_ENV=${APP_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - API_KEYS=${API_KEYS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-100}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-200}
      - MAX_QUERY_DEPTH=${MAX_QUERY_DEPTH:-10}
      - MAX_QUERY_COMPLEXITY=${MAX_QUERY_COMPLEXITY:-200}
      - MAX_PAGE_SIZE=${MAX_PAGE_SIZE:-100}
      - ENABLE_PLAYGROUND=${ENABLE_PLAYGROUND:-false}
      - ENABLE_INTROSPECTION=${ENABLE_INTROSPECTION:-false}
      - READ_TIMEOUT=${READ_TIMEOUT:-15s}
      - WRITE_TIMEOUT=${WRITE_TIMEOUT:-15s}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-60s}
      - SHUTDOWN_TIMEOUT=${SHUTDOWN_TIMEOUT:-30s}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-10s}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /graphql
    container_name: gql-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - app-network

